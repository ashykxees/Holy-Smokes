<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=8">
  <script src="/js/app.js?v=8"></script>
  <script src="/js/profile.js?v=4"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-3xl mx-auto w-full">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">Settings</h1>
      <p class="text-gray-500">Update your profile and preferences.</p>
    </header>

    <form id="profile-form" class="card space-y-5">
      <div class="flex flex-col items-center mb-2">
        <img id="picture-preview" src="" alt="" class="w-24 h-24 rounded-full object-cover border-2 border-hs-green mb-3 bg-gray-100">
        <label class="text-sm font-medium text-gray-700">Profile Picture</label>
        <input id="profile-picture" type="file" accept="image/*" class="mt-2 text-sm text-gray-600">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">DC Email</label>
        <input id="dc-email" type="email" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First Name <span class="text-red-500">*</span></label>
          <input id="first-name" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last Name <span class="text-red-500">*</span></label>
          <input id="last-name" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nickname</label>
        <input id="nickname" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
        <p class="text-xs text-gray-500 mt-1">If you add a nickname, the team will see this instead of your real name.</p>
      </div>

      <div id="phone-group">
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
        <input id="phone" type="tel" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
      </div>

      <label class="flex items-center gap-2 cursor-pointer flex-wrap">
        <input id="is-dc-employee" type="checkbox" class="h-5 w-5 accent-green-700">
        <span class="text-sm text-gray-700">I'm a DC Employee</span>
        <span class="text-xs text-gray-500">(we won't ask for your phone number)</span>
      </label>

      <div class="pt-4 border-t border-gray-100 space-y-4">
        <p class="text-sm text-gray-500">Change your password (optional).</p>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
          <input id="current-password" type="password" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <input id="new-password" type="password" minlength="6" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
        </div>
      </div>

      <button id="save-button" type="submit" class="btn-primary w-full">Save Changes</button>
    </form>
  </main>
</body>
</html>
