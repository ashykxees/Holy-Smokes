[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holy-smokes"
version = "0.1.0"
description = "Holy Smokes BBQ team management platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-jose[cryptography]",
    "aiosqlite",
    "websockets",
    "python-multipart",
]

[tool.setuptools]
packages = ["app", "backend"]
include-package-data = true

[tool.setuptools.package-data]
backend = ["frontend/**/*", "data/.gitkeep"]
