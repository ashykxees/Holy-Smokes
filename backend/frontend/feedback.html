<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=9">
  <script src="/js/app.js?v=16"></script>
  <script src="/js/feedback.js?v=2"></script>
  <style>
    .fb-question {
      padding: 1.5rem 0;
      border-top: 1px solid #f0f0f0;
    }

    .fb-question:first-child {
      border-top: none;
    }

    .fb-num {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--hs-green);
    }

    .fb-input {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .fb-input:focus {
      outline: none;
      border-color: var(--hs-green);
      box-shadow: 0 0 0 3px rgba(50, 74, 42, 0.12);
    }

    .fb-input[readonly] {
      background: #f9fafb;
      color: #6b7280;
      cursor: not-allowed;
    }

    .fb-choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .fb-choice span {
      display: inline-block;
      padding: 0.5rem 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 9999px;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .fb-choice input:checked + span {
      border-color: var(--hs-green);
      background-color: rgba(50, 74, 42, 0.08);
      color: var(--hs-green);
      font-weight: 600;
    }

    .fb-choice input:focus-visible + span {
      box-shadow: 0 0 0 3px rgba(50, 74, 42, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-10 w-full">
    <div class="max-w-2xl mx-auto">
      <header class="mb-8">
        <p class="fb-num mb-2">FEEDBACK</p>
        <h1 id="feedback-title" class="text-3xl font-bold">Feedback</h1>
        <p id="feedback-intro" class="text-gray-500 mt-2"></p>
        <a id="responses-link" href="/feedback-responses" class="hidden inline-block mt-3 text-sm font-semibold text-hs-green underline">View member responses</a>
      </header>

      <form id="feedback-form" class="card md:p-8" novalidate>
        <div id="questions"></div>
        <p id="feedback-error" class="text-sm text-red-600 mt-2 hidden"></p>
        <div class="pt-6">
          <button type="submit" class="btn-primary w-full py-3">Submit Feedback</button>
        </div>
      </form>

      <div id="feedback-thanks" class="card md:p-8 text-center hidden">
        <h2 class="text-2xl font-bold mb-2">Thank you!</h2>
        <p class="text-gray-500 mb-6">Your feedback was sent to the managers.</p>
        <button id="feedback-again" type="button" class="btn-secondary">Submit another response</button>
      </div>
    </div>
  </main>
</body>
</html>
