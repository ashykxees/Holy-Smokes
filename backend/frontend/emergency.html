<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=9">
  <script src="/js/app.js?v=11"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">Emergency Contacts</h1>
      <p class="text-gray-500">Important numbers for the team.</p>
    </header>

    <section class="card">
      <ul class="space-y-4">
        <li class="flex flex-col sm:flex-row sm:items-center sm:justify-between p-4 border border-red-100 bg-red-50 rounded-lg">
          <div class="flex items-center gap-3">
            <div class="bg-red-700 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">!</div>
            <div>
              <div class="font-semibold">Real Emergencies</div>
              <div class="text-sm text-gray-600">Life-threatening emergencies only</div>
            </div>
          </div>
          <a href="tel:911" class="mt-3 sm:mt-0 bg-red-700 hover:bg-red-800 text-white font-semibold px-4 py-2 rounded-lg text-center whitespace-nowrap inline-block">Call 911</a>
        </li>
        <li class="flex flex-col sm:flex-row sm:items-center sm:justify-between p-4 border border-gray-100 rounded-lg hover:bg-gray-50">
          <div class="flex items-center gap-3">
            <div class="bg-hs-green text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">G</div>
            <div>
              <div class="font-semibold">Griffin</div>
              <div class="text-sm text-gray-500">Team Contact</div>
            </div>
          </div>
          <a href="tel:610-715-2357" class="mt-3 sm:mt-0 btn-primary text-center whitespace-nowrap inline-block">Call 610-715-2357</a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
