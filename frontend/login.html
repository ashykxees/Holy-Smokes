<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js"></script>
</head>
<body data-login="true" class="min-h-screen flex items-center justify-center bg-white p-4">
  <div class="text-center max-w-sm w-full">
    <img src="/assets/logo.png" alt="Holy Smokes BBQ Team" class="h-32 w-auto mx-auto mb-6 object-contain">
    <h1 class="text-3xl font-bold tracking-tight mb-2">HOLY SMOKES</h1>
    <p class="text-gray-500 mb-8">BBQ Team Management</p>

    <div class="card flex flex-col items-center">
      <p class="text-sm text-gray-600 mb-4">Sign in with your <strong>@dccs.org</strong> Google account.</p>
      <div id="google-button" class="w-full flex justify-center"></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => renderGoogleButton('google-button'));
  </script>
</body>
</html>
