<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXP | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=9">
  <script src="/js/app.js?v=10"></script>
  <script src="/js/exp.js?v=1"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">EXP Leaderboard</h1>
      <p class="text-gray-500">Earn EXP by completing tasks and climb the ranks.</p>
    </header>

    <div id="user-status" class="mb-6 p-4 rounded-xl bg-hs-green text-white shadow flex items-center justify-between">
      <div class="font-medium">Loading your EXP...</div>
    </div>

    <section class="card">
      <h2 class="text-lg font-semibold mb-4">Top Earners</h2>
      <ul id="leaderboard" class="space-y-3">
        <li class="text-gray-500 text-sm">Loading...</li>
      </ul>
    </section>
  </main>
</body>
</html>
