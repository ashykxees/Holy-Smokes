<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=5">
  <script src="/js/app.js?v=5"></script>
  <script src="/js/dashboard.js?v=4"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
    <header class="mb-8">
      <h1 id="greeting" class="text-3xl md:text-4xl font-bold tracking-tight mb-2">What's up?</h1>
      <p class="text-gray-500">Here's what's happening with the team today.</p>
    </header>

    <section class="card mb-6 border-l-4 border-hs-green">
      <h2 class="text-lg font-semibold mb-2 hs-green">Motivational Quote</h2>
      <p id="quote" class="text-lg text-gray-800 italic quotes"></p>
    </section>

    <div class="grid md:grid-cols-2 gap-6">
      <section class="card">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Completed Tasks</h2>
          <a href="/tasks" class="text-sm font-medium hs-green hover:underline">View all</a>
        </div>
        <ul id="completed-tasks" class="space-y-3">
          <li class="text-gray-500 text-sm">Loading...</li>
        </ul>
      </section>

      <section class="card">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Recent Announcements</h2>
        </div>
        <ul id="announcements" class="space-y-3">
          <li class="text-gray-500 text-sm">Loading...</li>
        </ul>
      </section>
    </div>
  </main>
</body>
</html>
