<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=8">
  <script src="/js/app.js?v=8"></script>
  <script src="/js/email.js?v=8"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
    <header class="mb-6">
      <h1 class="text-3xl font-bold font-display">Mail</h1>
      <div class="flex gap-2 mt-3">
        <button id="tab-inbox" class="btn-primary">Inbox</button>
        <button id="tab-compose" class="btn-secondary">Compose</button>
      </div>
    </header>

    <section id="inbox-panel" class="space-y-6">
      <div class="card">
        <ul id="emails-list" class="space-y-2">
          <li class="text-gray-500 text-sm">Loading...</li>
        </ul>
      </div>

      <div id="inbox-detail" class="hidden space-y-6">
        <div class="card">
          <div class="flex items-start justify-between mb-4">
            <div>
              <h2 id="detail-subject" class="text-xl font-bold"></h2>
              <p id="detail-from" class="text-sm text-gray-600"></p>
              <p id="detail-to" class="text-xs text-gray-500"></p>
            </div>
            <span id="detail-time" class="text-xs text-gray-500"></span>
          </div>
          <div id="detail-body" class="text-gray-800 whitespace-pre-wrap"></div>
        </div>

        <div id="replies-list" class="space-y-4"></div>

        <div class="card">
          <h3 class="text-lg font-semibold mb-3">Reply</h3>
          <form id="reply-form" class="space-y-3">
            <textarea id="reply-body" rows="5" required class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Write your reply..."></textarea>
            <div class="flex items-center justify-between">
              <button type="button" id="back-to-inbox-list" class="btn-secondary">Back to inbox</button>
              <button type="submit" id="reply-btn" class="btn-primary">Send Reply</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <section id="compose-panel" class="hidden">
      <div class="card">
        <form id="compose-form" class="space-y-5">
          <div>
            <label for="to" class="block text-sm font-semibold text-gray-700 mb-1">To</label>
            <input id="to" name="to" type="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="recipient@example.com">
          </div>
          <div>
            <label for="subject" class="block text-sm font-semibold text-gray-700 mb-1">Subject</label>
            <input id="subject" name="subject" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Email subject">
          </div>
          <div>
            <label for="body" class="block text-sm font-semibold text-gray-700 mb-1">Message</label>
            <textarea id="body" name="body" rows="6" required class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Write your message here..."></textarea>
          </div>
          <div class="bg-gray-50 rounded-lg p-4 text-sm text-gray-600">
            <p class="font-semibold mb-2">Signature preview:</p>
            <div id="signature-preview" class="text-gray-700">Loading...</div>
          </div>
          <button type="submit" id="compose-submit" class="btn-primary w-full py-3 text-base">Send Email</button>
        </form>

        <div id="compose-success" class="hidden mt-6 text-center">
          <p class="text-hs-green font-bold mb-2">Email sent!</p>
          <p class="text-gray-600 text-sm">It will arrive from your @holysmokes.cc address with the Holy Smokes signature.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
