<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=7">
  <script src="/js/app.js?v=7"></script>
  <script src="/js/inbox.js?v=7"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
    <header class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold font-display">Inbox</h1>
        <p class="text-gray-500">Replies and inbound messages to the team.</p>
      </div>
      <button id="back-btn" class="btn-secondary hidden">Back to inbox</button>
    </header>

    <section id="inbox-list" class="card">
      <ul class="space-y-2" id="emails-list">
        <li class="text-gray-500 text-sm">Loading...</li>
      </ul>
    </section>

    <section id="inbox-detail" class="hidden space-y-6">
      <div class="card">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h2 id="detail-subject" class="text-xl font-bold"></h2>
            <p id="detail-from" class="text-sm text-gray-600"></p>
            <p id="detail-to" class="text-xs text-gray-500"></p>
          </div>
          <span id="detail-time" class="text-xs text-gray-500"></span>
        </div>
        <div id="detail-body" class="prose max-w-none text-gray-800 whitespace-pre-wrap"></div>
      </div>

      <div id="replies-list" class="space-y-4"></div>

      <div class="card">
        <h3 class="text-lg font-semibold mb-3">Reply</h3>
        <form id="reply-form" class="space-y-3">
          <textarea id="reply-body" rows="5" required class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Write your reply..."></textarea>
          <button type="submit" id="reply-btn" class="btn-primary">Send Reply</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
