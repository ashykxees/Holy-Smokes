<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=9">
  <script src="/js/app.js?v=14"></script>
  <script src="/js/volunteer.js?v=1"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
    <header class="mb-6">
      <h1 id="event-title" class="text-3xl font-bold">Volunteer Sign Up</h1>
      <p id="event-date" class="text-gray-500"></p>
      <p id="event-description" class="text-gray-600 mt-2"></p>
    </header>

    <div class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-900">
      <strong>Reminder:</strong>
      Hours you volunteer count toward your
      <a href="/service-hours" class="font-semibold underline text-green-800 hover:text-green-900">Service Hours</a>.
    </div>

    <section id="slots" class="grid md:grid-cols-2 gap-6">
      <div class="text-gray-500 text-sm">Loading...</div>
    </section>
  </main>
</body>
</html>
