<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=10">
  <script src="/js/app.js?v=12"></script>
  <script src="/js/calendar.js?v=2"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
    <header class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold">Calendar</h1>
        <p class="text-gray-500">Click a day with an event or due task, then use the Add to Google Calendar button on each item.</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="changeMonth(-1)" class="btn-secondary">&larr;</button>
        <div id="month-label" class="font-semibold text-lg min-w-[140px] text-center"></div>
        <button onclick="changeMonth(1)" class="btn-secondary">&rarr;</button>
      </div>
    </header>

    <div class="grid grid-cols-7 gap-2 mb-4 text-center text-sm font-semibold text-gray-500">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="calendar-grid" class="grid grid-cols-7 gap-2 mb-8"></div>

    <section class="card">
      <h2 id="selected-date" class="text-lg font-semibold mb-4">Select a date</h2>
      <ul id="day-items" class="space-y-3">
        <li class="text-gray-500 text-sm">Select a day on the calendar to see its events, due tasks, and Google Calendar export links.</li>
      </ul>
    </section>
  </main>
</body>
</html>
