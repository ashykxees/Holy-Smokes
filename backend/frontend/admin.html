<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Holy Smokes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css?v=10">
  <script src="/js/app.js?v=12"></script>
  <script src="/js/admin.js?v=10"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="nav" class="bg-white border-r border-gray-200 w-full md:w-64 md:min-h-screen flex flex-col"></aside>
  <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">Admin Panel</h1>
      <p class="text-gray-500">Manage managers and view all team contact info.</p>
    </header>

    <section class="card mb-8">
      <h2 class="text-lg font-semibold mb-4">Team Directory</h2>
      <div id="admin-list" class="divide-y divide-gray-100"></div>
    </section>

    <section class="card mb-8">
      <h2 class="text-lg font-semibold mb-4">Calendar Events</h2>
      <form id="event-form" class="grid md:grid-cols-2 gap-4 mb-6">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Event Title</label>
          <input id="event-title" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
          <input id="event-date" type="date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Time</label>
          <input id="event-time" type="time" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea id="event-description" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-700"></textarea>
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="btn-primary">Add Event</button>
        </div>
      </form>
      <div id="events-list" class="space-y-3"></div>
    </section>

    <section class="card">
      <h2 class="text-lg font-semibold mb-4">Email Log</h2>
      <p class="text-sm text-gray-500 mb-4">Original sent messages and replies, grouped by sender.</p>
      <div id="email-log-list" class="space-y-4"></div>
    </section>
  </main>
</body>
</html>
